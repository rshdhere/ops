# Path B — external execution host on EC2 (10.0.4.73).
# Scheduler and firecracker-host daemons run on the host; not deployed on EKS.
apiVersion: devin.baby/v1
kind: FirecrackerHost
metadata:
  name: devin-production-fc-01
  namespace: devin-firecracker
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  address: http://10.0.4.73:9092
  schedulerAddress: http://10.0.4.73:9091
  capacity:
    cpu: 8
    memory: 16Gi
