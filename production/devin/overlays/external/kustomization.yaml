apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/external
  - firecracker-hosts.yaml

patches:
  - path: patch-external-secret.yaml

images:
  - name: devin-orchestrator
    newName: rshdhere/devin-orchestrator
    newTag: f6c4dc4be4ca01d5a683574a063d0fe7e6147cd4
  - name: devin-server
    newName: rshdhere/devin-server
    newTag: f6c4dc4be4ca01d5a683574a063d0fe7e6147cd4
  - name: devin-web
    newName: rshdhere/devin-web
    newTag: f6c4dc4be4ca01d5a683574a063d0fe7e6147cd4

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: devin
      app.kubernetes.io/managed-by: argocd
