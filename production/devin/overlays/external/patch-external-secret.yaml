# Merge GitOps platform URLs; DATABASE_URL comes from devin-postgres secret on the pod.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devin-server
  namespace: devin-app
spec:
  target:
    template:
      mergePolicy: Merge
      engineVersion: v2
      data:
        SCHEDULER_URL: http://devin-brain:9092
        BETTER_AUTH_URL: https://api.devin.baby
        WEB_APP_URL: https://devin.baby
