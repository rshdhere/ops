# GitOps-managed keys merged into the Vault-backed devin-server secret.
# DATABASE_URL, BETTER_AUTH_SECRET, and OAuth keys must still live in Vault (prod/server).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devin-server
  namespace: devin-app
spec:
  target:
    template:
      mergePolicy: Merge
      engineVersion: v2
      data:
        SCHEDULER_URL: http://10.0.7.138:9091
        BETTER_AUTH_URL: https://api.devin.baby
        WEB_APP_URL: https://devin.baby
