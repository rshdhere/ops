apiVersion: apps/v1
kind: Deployment
metadata:
  name: devin-web
  namespace: devin-app
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app: devin-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devin-web
  template:
    metadata:
      labels:
        app: devin-web
    spec:
      containers:
        - name: web
          image: devin-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: devin-web
  namespace: devin-app
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app: devin-web
spec:
  selector:
    app: devin-web
  ports:
    - name: http
      port: 80
      targetPort: http
