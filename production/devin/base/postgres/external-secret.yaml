# Vault keys (populate before first sync)
#
#   vault kv put secret/prod/postgres \
#     POSTGRES_USER=devin \
#     POSTGRES_PASSWORD='(openssl rand -base64 24)' \
#     POSTGRES_DB=devin
#
#   vault kv put secret/staging/postgres \
#     POSTGRES_USER=devin \
#     POSTGRES_PASSWORD='(openssl rand -base64 24)' \
#     POSTGRES_DB=devin_staging
#
# After the internal NLB for postgres is ready, add worker connectivity:
#
#   vault kv patch secret/prod/postgres \
#     DATABASE_URL_EXTERNAL='postgres://devin:PASS@internal-nlb-hostname:5432/devin'
#
# Then set SSM /devin-production/platform/database_url to DATABASE_URL_EXTERNAL
# and run devin-sync-platform-config on execution hosts.
#
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devin-postgres
  namespace: devin-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: devin-postgres
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_USER: "{{ .POSTGRES_USER }}"
        POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
        POSTGRES_DB: "{{ .POSTGRES_DB }}"
        DATABASE_URL: "postgres://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASSWORD }}@devin-postgres:5432/{{ .POSTGRES_DB }}?sslmode=disable"
  dataFrom:
    - extract:
        key: prod/postgres
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
