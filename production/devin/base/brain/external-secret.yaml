# Syncs secret/<env>/brain from Vault into the devin-brain K8s Secret.
# Overlay patches spec.dataFrom[0].extract.key per environment.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devin-brain
  namespace: devin-app
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: devin-brain
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: prod/brain
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
