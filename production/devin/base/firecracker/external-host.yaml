# Register dedicated EC2 execution hosts (outside the cluster) with the orchestrator.
# Apply one FirecrackerHost per host via the external overlay (firecracker-hosts.yaml).
#
#   kubectl apply -f production/devin/overlays/external/firecracker-hosts.yaml
#
apiVersion: devin.baby/v1
kind: FirecrackerHost
metadata:
  name: devin-production-fc-01
  namespace: devin-firecracker
spec:
  address: http://10.0.4.73:9092
  schedulerAddress: http://10.0.4.73:9091
  capacity:
    cpu: 8
    memory: 16Gi
