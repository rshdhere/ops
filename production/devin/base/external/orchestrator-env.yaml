# Path B — external Firecracker hosts are registered via FirecrackerHost CRs, not node labels.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devin-orchestrator
  namespace: devin-system
spec:
  template:
    spec:
      containers:
        - name: orchestrator
          env:
            - name: ORCHESTRATOR_NODE_REGISTER_ENABLED
              value: "false"
            - name: ORCHESTRATOR_CONTROLLER_ENABLED
              value: "true"
            - name: ORCHESTRATOR_DRY_RUN
              value: "false"
