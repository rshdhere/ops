# Syncs secret/<env>/server from Vault into the devin-server K8s Secret.
# Overlay patches spec.dataFrom[0].extract.key per environment (staging/server, prod/server).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devin-server
  namespace: devin-app
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: devin-server
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/server
