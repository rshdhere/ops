apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rshdhere/ops.git
    targetRevision: HEAD
    path: production/devin/overlays/external
    kustomize:
      buildOptions: --load-restrictor LoadRestrictionsNone
  destination:
    server: https://kubernetes.default.svc
    namespace: devin-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: devin
      kind: FirecrackerHost
      jqPathExpressions:
        - .status
