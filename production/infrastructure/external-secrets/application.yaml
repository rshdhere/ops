apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 0.11.0
      helm:
        releaseName: external-secrets
        valuesObject:
          installCRDs: true
          serviceAccount:
            create: true
            name: external-secrets
    - repoURL: https://github.com/rshdhere/ops.git
      targetRevision: HEAD
      path: production/infrastructure/external-secrets/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
