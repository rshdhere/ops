# GitOps-managed keys merged into the Vault-backed devin-server secret.
# DATABASE_URL, BETTER_AUTH_SECRET, and OAuth keys must still live in Vault (staging/server).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devin-server
  namespace: devin-app
spec:
  dataFrom:
    - extract:
        key: staging/server
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
  target:
    template:
      mergePolicy: Merge
      engineVersion: v2
      data:
        SCHEDULER_URL: http://10.0.4.73:9091
        BETTER_AUTH_URL: https://staging-api.devin.baby
        WEB_APP_URL: https://staging.devin.baby
