apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devin-postgres
spec:
  target:
    template:
      engineVersion: v2
      data:
        POSTGRES_USER: "{{ .POSTGRES_USER }}"
        POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
        POSTGRES_DB: "{{ .POSTGRES_DB }}"
        DATABASE_URL: "postgres://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASSWORD }}@devin-postgres:5432/{{ .POSTGRES_DB }}?sslmode=disable"
  dataFrom:
    - extract:
        key: staging/postgres
