apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devin-postgres
  namespace: devin-app
spec:
  target:
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        POSTGRES_USER: "{{ .POSTGRES_USER }}"
        POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
        POSTGRES_DB: "{{ .POSTGRES_DB }}"
        DATABASE_URL: "postgres://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASSWORD }}@devin-postgres:5432/{{ .POSTGRES_DB }}?sslmode=disable"
  dataFrom:
    - extract:
        key: staging/postgres
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
