apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../production/devin/base/external
  - firecracker-hosts.yaml

patches:
  - path: patch-external-secret.yaml

images:
  - name: devin-orchestrator
    newName: rshdhere/devin-orchestrator
    newTag: b3a7e6fe4cd75e76c3e85a574fa7c76cda99a4dc
  - name: devin-server
    newName: rshdhere/devin-server
    newTag: b3a7e6fe4cd75e76c3e85a574fa7c76cda99a4dc
  - name: devin-web
    newName: rshdhere/devin-web
    newTag: b3a7e6fe4cd75e76c3e85a574fa7c76cda99a4dc

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: devin
      app.kubernetes.io/managed-by: argocd
      app.kubernetes.io/environment: staging
