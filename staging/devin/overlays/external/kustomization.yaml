apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devin-staging

resources:
  - rbac.yaml
  - orchestrator-lb.yaml
  - ../../../../production/devin/base/postgres/external-secret.yaml
  - ../../../../production/devin/base/postgres/statefulset.yaml
  - ../../../../production/devin/base/brain/deployment.yaml
  - ../../../../production/devin/base/platform/configmap.yaml
  - ../../../../production/devin/base/orchestrator/deployment.yaml
  - ../../../../production/devin/base/app/serviceaccount-server.yaml
  - ../../../../production/devin/base/app/server.yaml
  - ../../../../production/devin/base/app/web.yaml
  - ../../../../production/devin/base/app/ingress.yaml
  - ../../../../production/devin/base/vault/external-secret.yaml
  - firecracker-hosts.yaml

patches:
  - path: patch-orchestrator-env.yaml
  - path: patch-external-secret.yaml
  - path: patch-postgres-secret.yaml
  - path: patch-platform-config.yaml
  - path: patch-server-database.yaml
  - path: patch-ingress.yaml

images:
  - name: devin-orchestrator
    newName: rshdhere/devin-orchestrator
    newTag: 483e2672d3617d47b8335dee04a8e1b2f09e10aa
  - name: devin-server
    newName: rshdhere/devin-server
    newTag: 483e2672d3617d47b8335dee04a8e1b2f09e10aa
  - name: devin-web
    newName: rshdhere/devin-web
    newTag: 483e2672d3617d47b8335dee04a8e1b2f09e10aa
  - name: devin-brain
    newName: rshdhere/devin-brain
    newTag: 483e2672d3617d47b8335dee04a8e1b2f09e10aa

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: devin
      app.kubernetes.io/managed-by: argocd
      app.kubernetes.io/environment: staging
