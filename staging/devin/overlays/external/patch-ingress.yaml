# Override devin ingress hostnames for staging.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devin-ingress
  namespace: devin-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - staging.devin.baby
      secretName: devin-web-tls
    - hosts:
        - staging-api.devin.baby
      secretName: devin-api-tls
  rules:
    - host: staging.devin.baby
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devin-web
                port:
                  number: 80
    - host: staging-api.devin.baby
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devin-server
                port:
                  number: 8080
