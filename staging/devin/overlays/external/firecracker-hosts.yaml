# Path B — shares the production execution host for now (10.0.7.138).
# CR lives in devin-staging (staging overlay namespace) so the staging orchestrator can watch it.
apiVersion: devin.baby/v1
kind: FirecrackerHost
metadata:
  name: devin-staging-fc-01
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  address: http://10.0.7.138:9092
  schedulerAddress: http://10.0.7.138:9091
  capacity:
    cpu: 8
    memory: 16Gi
